[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listensignal"
version = "1.0.0"
description = "ListenSignal: open, local-first media and social listening for Norwegian-language sources"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ulrik Erlingsen" }]
keywords = [
  "media monitoring",
  "social listening",
  "share of voice",
  "norwegian",
  "sentiment analysis",
  "rss",
  "streamlit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Natural Language :: Norwegian",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "feedparser>=6.0,<7",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<4",
  "plotly>=5.19,<8",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "streamlit>=1.51,<2",
]

[project.optional-dependencies]
sentiment = [
  "torch>=2.1",
  "transformers>=4.36,<5",
]
test = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
listensignal-collect = "listensignal.collect:main"
listensignal-pulse = "listensignal.pulse:main"

[project.urls]
Homepage = "https://github.com/UlrikErlingsen/media-listening"
Source = "https://github.com/UlrikErlingsen/media-listening"
Issues = "https://github.com/UlrikErlingsen/media-listening/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
listensignal = ["lexicon/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
